services:
  - type: web
    name: equestrian-esports-championship
    env: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /landing.html
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
